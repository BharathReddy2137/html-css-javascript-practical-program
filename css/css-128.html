<!DOCTYPE html>
<html>
<head>
<title>CSS 128 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}

.icon{font-size:35px;color:#ff6422}.insight{border-left:3px solid #ff6422;padding:15px;color:#aaa}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><div class="card"><div class="icon">✦</div><h1>AI Insight</h1><div class="insight">Your weekly active users increased consistently over the selected period.</div></div></main>

</html>
