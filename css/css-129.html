<!DOCTYPE html>
<html>
<head>
<title>CSS 129 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
.layout{display:grid;grid-template-columns:1fr 340px;height:100vh}
main{padding:50px}.side{background:#111;border-left:1px solid #2a2a2a;padding:25px}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}.msg{background:#151515;border:1px solid #2a2a2a;padding:15px;border-radius:12px;margin:12px 0}
input{width:100%;padding:13px;background:#0b0b0b;border:1px solid #333;color:white;border-radius:8px}
</style>
</head>
<body>
<div class="layout">
<main><div class="logo">Dev<span>Core.</span></div><h1>Workspace</h1><p style="color:#999">Build your project with AI assistance.</p></main>
<aside class="side"><h2>AI Copilot</h2><div class="msg">How can I help?</div><div class="msg">I can analyze, generate and explain.</div><input placeholder="Ask Copilot..."></aside>
</div>
</body>
</html>
