<!DOCTYPE html>
<html>
<head>
<title>CSS 132 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:800px;margin:60px auto;padding:20px}.card{background:#151515;border:1px solid #2a2a2a;padding:30px;border-radius:18px}
textarea{width:100%;height:120px;background:#0b0b0b;border:1px solid #333;color:white;padding:15px;border-radius:10px}
button{margin-top:15px;padding:12px 25px;background:#ff6422;border:0;border-radius:8px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><div class="card"><h1>AI Content Generator</h1>
<textarea placeholder="Describe the content you want..."></textarea><button>Generate Content</button>
</div></main>
</body>
</html>
