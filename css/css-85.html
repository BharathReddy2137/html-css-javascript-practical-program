<!DOCTYPE html>
<html>
<head>
<title>CSS 85 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 8%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:700px;margin:60px auto;padding:20px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:18px;padding:35px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
input,select{width:100%;padding:13px;background:#0b0b0b;color:white;border:1px solid #333;border-radius:8px;margin-top:7px}
button{margin-top:20px;padding:14px 30px;background:#ff6422;border:0;border-radius:8px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><div class="card">
<h1>Registration</h1>
<div class="grid">
<label>First Name<input></label>
<label>Last Name<input></label>
<label>Email<input type="email"></label>
<label>Phone<input type="tel"></label>
<label>Country<select><option>India</option><option>USA</option></select></label>
<label>Course<input></label>
</div>
<button>Register</button>
</div></main>
</body>
</html>
