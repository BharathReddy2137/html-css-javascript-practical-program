<!DOCTYPE html>
<html>
<head>
<title>CSS 163 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:40px 7%}.builder{display:grid;grid-template-columns:220px 1fr;gap:20px}.panel,.canvas{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:25px}
.block{padding:15px;background:#222;border-radius:8px;margin:10px 0}.canvas{min-height:350px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><h1>Automation Builder</h1><div class="builder">
<div class="panel"><h3>Actions</h3><div class="block">Trigger</div><div class="block">Condition</div><div class="block">Action</div></div>
<div class="canvas"><h2>Workflow</h2><p style="color:#777">Build your automation here.</p></div>
</div></main>
</body>
</html>
