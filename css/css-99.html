<!DOCTYPE html>
<html>
<head>
<title>CSS 99 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:40px 6%}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:25px}
.num{font-size:34px;font-weight:bold}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>Financial Analytics</h1>
<div class="grid">
<div class="card"><small>Revenue</small><div class="num">$284K</div></div>
<div class="card"><small>Expenses</small><div class="num">$92K</div></div>
<div class="card"><small>Profit</small><div class="num">$192K</div></div>
</div>
<div class="card" style="margin-top:20px">
<h2>Financial Summary</h2>
<p>Revenue <b style="float:right">$284,620</b></p>
<hr style="border-color:#2a2a2a">
<p>Expenses <b style="float:right">$92,480</b></p>
<hr style="border-color:#2a2a2a">
<p>Net Profit <b style="float:right;color:#ff6422">$192,140</b></p>
</div>
</main>
</body>
</html>
