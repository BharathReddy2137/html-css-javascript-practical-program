<!DOCTYPE html>
<html><head><title>CSS 231 | DevCore</title>
<style>
body{margin:0;background:#0b0b0b;color:white;font-family:Arial;text-align:center;padding:100px}label{background:#ff6422;padding:12px 25px;border-radius:8px;cursor:pointer}
input{display:none}.modal{display:none;position:fixed;inset:0;background:#000b;place-items:center}.box{background:#151515;padding:35px;border:1px solid #2a2a2a;border-radius:16px;width:350px}input:checked~.modal{display:grid}
.close{background:#ff6422;padding:10px 20px;border-radius:7px;display:inline-block}
</style></head><body><label for="open">Open Modal</label><input id="open" type="checkbox"><div class="modal"><div class="box"><h2>CSS Modal</h2><p>This modal uses only CSS.</p><label class="close" for="open">Close</label></div></div></body></html>
