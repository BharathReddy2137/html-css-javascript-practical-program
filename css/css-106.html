<!DOCTYPE html>
<html>
<head>
<title>CSS 106 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:850px;margin:50px auto;padding:20px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:30px}
.chart{height:250px;display:flex;align-items:end;gap:20px}
.bar{flex:1;background:#ff6422;border-radius:7px 7px 0 0;position:relative}
.bar span{position:absolute;bottom:-25px;width:100%;text-align:center;color:#999}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>Bar Chart Analytics</h1>
<div class="card">
<div class="chart">
<div class="bar" style="height:50%"><span>Jan</span></div>
<div class="bar" style="height:70%"><span>Feb</span></div>
<div class="bar" style="height:45%"><span>Mar</span></div>
<div class="bar" style="height:85%"><span>Apr</span></div>
<div class="bar" style="height:65%"><span>May</span></div>
<div class="bar" style="height:95%"><span>Jun</span></div>
</div>
</div>
</main>
</body>
</html>
