<!DOCTYPE html>
<html>
<head>
<title>CSS 149 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}

.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}

</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><h1>Agent Status</h1><div class="card">

<div class="row">Support Agent <span>○ Idle</span></div>
<div class="row">Report Agent <span class="online">● Running</span></div>
</div></main>
</body>
</html>
