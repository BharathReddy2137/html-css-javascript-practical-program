<!DOCTYPE html>
<html>
<head>
<title>CSS 130 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:650px;margin:80px auto;padding:20px}.box{background:#151515;border:1px solid #444;border-radius:12px;padding:15px}
input{width:100%;background:transparent;border:0;color:white;outline:0;font-size:18px}
.suggest{padding:15px;color:#888;border-top:1px solid #2a2a2a}.suggest b{color:white}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><h1>AI Autocomplete</h1><div class="box">
<input value="Create a dashboard for">
<div class="suggest"><b>Create a dashboard for</b> SaaS analytics</div>
<div class="suggest"><b>Create a dashboard for</b> customer metrics</div>
</div></main>
</body>
</html>
