<!DOCTYPE html>
<html>
<head>
<title>CSS 82 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 8%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:450px;margin:60px auto;padding:20px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:18px;padding:30px}
input{width:100%;padding:13px;margin:7px 0 15px;background:#0b0b0b;color:#fff;border:1px solid #333;border-radius:8px}
button{width:100%;padding:14px;background:#ff6422;border:0;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><div class="card">
<h1>Create Account</h1>
<input placeholder="Full Name">
<input type="email" placeholder="Email Address">
<input type="password" placeholder="Password">
<input type="password" placeholder="Confirm Password">
<button>Sign Up</button>
</div></main>
</body>
</html>
