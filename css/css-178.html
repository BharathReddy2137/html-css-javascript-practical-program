<!DOCTYPE html>
<html>
<head>
<title>CSS 178 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:40px 7%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#151515;border:1px solid #2a2a2a;padding:25px;border-radius:16px}.value{font-size:30px;color:#ff6422}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><h1>Model Monitoring</h1><div class="grid">
<div class="card">Latency<div class="value">82ms</div></div>
<div class="card">Requests<div class="value">2.4K</div></div>
<div class="card">Errors<div class="value">0.4%</div></div>
</div></main>
</body>
</html>
