<!DOCTYPE html>
<html>
<head>
<title>CSS 125 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:800px;margin:60px auto;padding:20px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:18px;padding:30px}
.badge{color:#ff6422;border:1px solid #55301f;padding:6px 10px;border-radius:20px;font-size:12px}
.content{background:#0f0f0f;padding:20px;border-radius:12px;margin-top:20px;line-height:1.7;color:#ccc}
button{padding:10px 18px;background:#ff6422;border:0;border-radius:8px;margin-top:15px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<div class="card">
<span class="badge">AI GENERATED</span>
<h1>Product Launch Announcement</h1>
<div class="content">
Our new platform helps teams organize their work, understand their data, and collaborate more efficiently. Explore the latest features and discover a simpler way to manage your workflow.
</div>
<button>Copy Content</button>
</div>
</main>
</body>
</html>
