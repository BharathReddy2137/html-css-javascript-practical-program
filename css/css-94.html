<!DOCTYPE html>
<html>
<head>
<title>CSS 94 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:40px 6%}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:25px}
.num{font-size:32px;font-weight:bold}
.bar{height:10px;background:#292929;border-radius:20px;margin-top:15px}
.fill{height:100%;background:#ff6422;border-radius:20px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>Sales Analytics</h1>
<div class="grid">
<div class="card"><p>Total Sales</p><div class="num">$128K</div></div>
<div class="card"><p>Orders</p><div class="num">2,840</div></div>
<div class="card"><p>Conversion</p><div class="num">8.4%</div></div>
</div>
<div class="card" style="margin-top:20px">
<h2>Sales Target</h2>
<p>84% completed</p>
<div class="bar"><div class="fill" style="width:84%"></div></div>
</div>
</main>
</body>
</html>
