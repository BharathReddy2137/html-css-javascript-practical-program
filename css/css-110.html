<!DOCTYPE html>
<html>
<head>
<title>CSS 110 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:40px 6%}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:25px}
.value{font-size:34px;font-weight:bold}
.mini{height:70px;display:flex;align-items:end;gap:5px}
.mini i{flex:1;background:#ff6422;border-radius:3px 3px 0 0}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>Visualization Cards</h1>
<div class="grid">
<div class="card"><small>Revenue</small><div class="value">$82K</div><div class="mini"><i style="height:40%"></i><i style="height:70%"></i><i style="height:50%"></i><i style="height:90%"></i></div></div>
<div class="card"><small>Users</small><div class="value">18.4K</div><div class="mini"><i style="height:60%"></i><i style="height:45%"></i><i style="height:80%"></i><i style="height:95%"></i></div></div>
<div class="card"><small>Orders</small><div class="value">4,820</div><div class="mini"><i style="height:30%"></i><i style="height:55%"></i><i style="height:75%"></i><i style="height:65%"></i></div></div>
</div>
</main>
</body>
</html>
