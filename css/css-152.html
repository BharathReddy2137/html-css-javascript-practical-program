<!DOCTYPE html>
<html>
<head>
<title>CSS 151 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:800px;margin:50px auto;padding:20px}.log{background:#151515;border:1px solid #2a2a2a;border-radius:14px;padding:20px}
.event{padding:15px;border-bottom:1px solid #2a2a2a}.time{color:#ff6422;font-size:12px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><h1>Agent Activity Log</h1><div class="log">
<div class="event"><span class="time">10:42</span> Agent started task</div>
<div class="event"><span class="time">10:43</span> Data loaded</div>
<div class="event"><span class="time">10:45</span> Analysis completed</div>
<div class="event"><span class="time">10:46</span> Report generated</div>
</div></main>
</body>
</html>
