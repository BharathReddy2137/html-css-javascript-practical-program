<!DOCTYPE html>
<html>
<head>
<title>CSS 180 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:800px;margin:50px auto;padding:20px}.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:30px}
.row{margin:20px 0}.row label{display:block;margin-bottom:8px}.bar{height:13px;background:#292929;border-radius:20px}.fill{height:100%;background:#ff6422;border-radius:20px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><div class="card"><h1>Feature Importance</h1>
<div class="row"><label>Monthly Usage — 92%</label><div class="bar"><div class="fill" style="width:92%"></div></div></div>
<div class="row"><label>Account Age — 76%</label><div class="bar"><div class="fill" style="width:76%"></div></div></div>
<div class="row"><label>Plan Type — 58%</label><div class="bar"><div class="fill" style="width:58%"></div></div></div>
<div class="row"><label>Region — 31%</label><div class="bar"><div class="fill" style="width:31%"></div></div></div>
</div></main>
</body>
</html>
