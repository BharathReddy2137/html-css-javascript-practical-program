<!DOCTYPE html>
<html><head><title>CSS 207 | DevCore</title>
<style>
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}nav{padding:20px 7%;background:#111}.logo span{color:#ff6422}
main{max-width:850px;margin:50px auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.meter{background:#151515;padding:25px;border:1px solid #2a2a2a;border-radius:15px}
.bar{height:10px;background:#333;border-radius:8px;margin-top:15px}.fill{height:100%;background:#ff6422;width:70%}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><nav><b class="logo">Dev<span>Core.</span></b></nav><main><h1>Usage Meters</h1><div class="grid">
<div class="meter">Storage<h2>70 GB</h2><div class="bar"><div class="fill"></div></div></div>
<div class="meter">Users<h2>240</h2><div class="bar"><div class="fill" style="width:48%"></div></div></div>
<div class="meter">Requests<h2>65K</h2><div class="bar"><div class="fill" style="width:65%"></div></div></div>
</div></main></body></html>
