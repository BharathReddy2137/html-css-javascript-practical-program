<!DOCTYPE html>
<html>
<head>
<title>CSS 157 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:700px;margin:60px auto;padding:20px}.card{background:#151515;border:1px solid #2a2a2a;padding:30px;border-radius:16px}
.permission{display:flex;justify-content:space-between;padding:18px;border-bottom:1px solid #2a2a2a}
.toggle{width:45px;height:24px;background:#ff6422;border-radius:20px;padding:3px}.toggle:after{content:"";display:block;width:18px;height:18px;background:#111;border-radius:50%;margin-left:19px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><div class="card"><h1>Agent Permissions</h1>
<div class="permission">Read Data <span class="toggle"></span></div>
<div class="permission">Write Reports <span class="toggle"></span></div>
<div class="permission">Access Analytics <span class="toggle"></span></div>
<div class="permission">Send Notifications <span class="toggle"></span></div>
</div></main>
</body>
</html>
