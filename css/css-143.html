<!DOCTYPE html>
<html>
<head>
<title>CSS 143 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:600px;margin:70px auto;padding:20px}.card{background:#151515;border:1px solid #2a2a2a;border-radius:18px;padding:35px;text-align:center}
.score{width:160px;height:160px;border-radius:50%;border:15px solid #ff6422;display:grid;place-items:center;margin:25px auto;font-size:35px;font-weight:bold}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><div class="card"><h1>AI Confidence</h1><div class="score">94%</div><p style="color:#999">Model confidence score</p></div></main>
</body>
</html>
