<!DOCTYPE html>
<html>
<head>
<title>CSS 131 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:800px;margin:70px auto;padding:20px}.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.card{padding:22px;background:#151515;border:1px solid #2a2a2a;border-radius:14px}.card:hover{border-color:#ff6422}
@media(max-width:600px){.suggestions{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><h1>Smart Suggestions</h1><div class="suggestions">
<div class="card">📊 Analyze this data</div><div class="card">📝 Summarize this report</div>
<div class="card">💡 Generate insights</div><div class="card">🔍 Find anomalies</div>
</div></main>
</body>
</html>
