<!DOCTYPE html>
<html>
<head>
<title>CSS 126 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:750px;margin:70px auto;padding:20px}.card{background:#151515;border:1px solid #2a2a2a;border-radius:18px;padding:30px}
.tag{color:#ff6422;font-size:12px}.summary{margin-top:20px;background:#0f0f0f;padding:20px;border-radius:12px;line-height:1.7;color:#bbb}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><div class="card">
<span class="tag">AI SUMMARY</span>
<h1>Project Summary</h1>
<div class="summary">The project focuses on improving dashboard performance, user engagement and analytics visibility.</div>
</div></main>
</body>
</html>
