<!DOCTYPE html>
<html>
<head>
<title>CSS 135 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:800px;margin:80px auto;padding:20px}.query{background:#151515;border:1px solid #444;padding:18px;border-radius:12px}
input{width:100%;background:transparent;border:0;color:white;font-size:18px;outline:0}
.answer{margin-top:20px;background:#151515;border:1px solid #2a2a2a;padding:25px;border-radius:15px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><h1>Natural Language Query</h1>
<div class="query"><input value="Show revenue for the last 6 months"></div>
<div class="answer"><h2>AI Result</h2><p style="color:#aaa">Revenue increased steadily across the selected six-month period.</p></div>
</main>
</body>
</html>
