<!DOCTYPE html>
<html><head><title>CSS 213 | DevCore</title>
<style>
body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial}nav{padding:20px 7%;background:#111}.logo span{color:#ff6422}
main{max-width:1100px;margin:40px auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#151515;padding:25px;border:1px solid #2a2a2a;border-radius:15px}.num{font-size:30px;color:#ff6422}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style></head><body><nav><b class="logo">Dev<span>Core.</span></b></nav><main><h1>SaaS Dashboard</h1><div class="grid">
<div class="card">Users<div class="num">12K</div></div><div class="card">Revenue<div class="num">$42K</div></div><div class="card">Projects<div class="num">284</div></div><div class="card">Growth<div class="num">18%</div></div>
</div></main></body></html>
