<!DOCTYPE html>
<html>
<head>
<title>CSS 146 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:35px 6%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#151515;border:1px solid #2a2a2a;border-radius:15px;padding:23px}
.status{color:#ff6422;font-size:13px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><h1>AI Agent Dashboard</h1><div class="grid">
<div class="card"><span class="status">● ONLINE</span><h2>Research Agent</h2><p>Analyzing documents</p></div>
<div class="card"><span class="status">● ONLINE</span><h2>Analytics Agent</h2><p>Processing metrics</p></div>
<div class="card"><span class="status">● IDLE</span><h2>Support Agent</h2><p>Waiting for tasks</p></div>
</div></main>
</body>
</html>
