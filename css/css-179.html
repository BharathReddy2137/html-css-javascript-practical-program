<!DOCTYPE html>
<html>
<head>
<title>CSS 179 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:850px;margin:50px auto;padding:20px}.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:25px;margin:15px 0}
.bar{height:12px;background:#292929;border-radius:20px}.fill{height:100%;background:#ff6422;border-radius:20px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><h1>Data Drift Monitoring</h1>
<div class="card"><p>Feature A — 18%</p><div class="bar"><div class="fill" style="width:18%"></div></div></div>
<div class="card"><p>Feature B — 42%</p><div class="bar"><div class="fill" style="width:42%"></div></div></div>
<div class="card"><p>Feature C — 72%</p><div class="bar"><div class="fill" style="width:72%"></div></div></div>
</main>
</body>
</html>
