<!DOCTYPE html>
<html><head><title>CSS 229 | DevCore</title>
<style>
body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;padding:60px 7%}
.card{background:#151515;padding:30px;border:1px solid #2a2a2a;border-radius:16px;animation:float 3s ease-in-out infinite}.card:nth-child(2){animation-delay:.5s}.card:nth-child(3){animation-delay:1s}
h2{color:#ff6422}@keyframes float{50%{transform:translateY(-10px)}}
</style></head><body><div class="grid"><div class="card"><h2>Analytics</h2><p>Live data</p></div><div class="card"><h2>AI</h2><p>Smart insights</p></div><div class="card"><h2>Reports</h2><p>Business reports</p></div></div></body></html>
