<!DOCTYPE html>
<html>
<head>
<title>CSS 174 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:40px 7%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:30px}.score{font-size:40px;color:#ff6422}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><h1>Prediction Comparison</h1><div class="grid">
<div class="card"><h2>Model A</h2><div class="score">89%</div><p>Accuracy</p></div>
<div class="card"><h2>Model B</h2><div class="score">94%</div><p>Accuracy</p></div>
</div></main>
</body>
</html>
