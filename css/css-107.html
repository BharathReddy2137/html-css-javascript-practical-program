<!DOCTYPE html>
<html>
<head>
<title>CSS 107 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:900px;margin:50px auto;padding:20px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:30px}
svg{width:100%;height:280px}
.area{fill:#ff6422;opacity:.25}
.line{fill:none;stroke:#ff6422;stroke-width:5}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>Area Chart</h1>
<div class="card">
<svg viewBox="0 0 800 280">
<path class="area" d="M20 230 L150 170 L280 190 L410 100 L540 140 L670 60 L780 90 L780 250 L20 250 Z"/>
<path class="line" d="M20 230 L150 170 L280 190 L410 100 L540 140 L670 60 L780 90"/>
</svg>
</div>
</main>
</body>
</html>
