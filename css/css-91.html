<!DOCTYPE html>
<html>
<head>
<title>CSS 91 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 5%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:35px 5%}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:15px;padding:25px}
.value{font-size:32px;font-weight:bold}
.chart{height:150px;display:flex;align-items:end;gap:10px}
.chart i{display:block;flex:1;background:#ff6422;border-radius:5px 5px 0 0}
@media(max-width:750px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>Analytics Dashboard</h1>
<div class="grid">
<div class="card"><p>Visitors</p><div class="value">84.2K</div></div>
<div class="card"><p>Sessions</p><div class="value">42.8K</div></div>
<div class="card"><p>Conversion</p><div class="value">6.8%</div></div>
<div class="card" style="grid-column:1/-1">
<h2>Traffic Overview</h2>
<div class="chart">
<i style="height:40%"></i><i style="height:60%"></i><i style="height:45%"></i>
<i style="height:80%"></i><i style="height:65%"></i><i style="height:95%"></i>
</div>
</div>
</div>
</main>
</body>
</html>
