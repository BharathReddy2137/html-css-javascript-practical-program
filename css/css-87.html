<!DOCTYPE html>
<html>
<head>
<title>CSS 87 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 8%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:600px;margin:60px auto;padding:20px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:18px;padding:30px}
.steps{display:flex;gap:8px;margin-bottom:30px}
.steps span{flex:1;height:5px;background:#333;border-radius:10px}
.steps span.active{background:#ff6422}
input{width:100%;padding:14px;margin:10px 0 20px;background:#0b0b0b;color:white;border:1px solid #333;border-radius:8px}
button{padding:13px 25px;background:#ff6422;border:0;border-radius:8px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><div class="card">
<div class="steps"><span class="active"></span><span class="active"></span><span></span></div>
<h1>Step 2 of 3</h1>
<label>Address</label>
<input placeholder="Enter your address">
<label>City</label>
<input placeholder="Enter your city">
<button>Continue →</button>
</div></main>
</body>
</html>
