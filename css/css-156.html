<!DOCTYPE html>
<html>
<head>
<title>CSS 156 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:700px;margin:60px auto;padding:20px}.card{background:#151515;border:1px solid #2a2a2a;padding:30px;border-radius:16px}
input,select{width:100%;padding:13px;margin:8px 0 20px;background:#0b0b0b;color:white;border:1px solid #333;border-radius:8px}
button{padding:13px 25px;background:#ff6422;border:0;border-radius:8px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><div class="card"><h1>Agent Configuration</h1>
<label>Agent Name</label><input value="Research Agent">
<label>Model</label><select><option>DevCore AI</option><option>Advanced Model</option></select>
<label>Temperature</label><input type="range" value="50"><button>Save Settings</button>
</div></main>
</body>
</html>
