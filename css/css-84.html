<!DOCTYPE html>
<html>
<head>
<title>CSS 84 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 8%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:430px;margin:80px auto;padding:20px}
.card{background:#151515;border:1px solid #2a2a2a;padding:35px;border-radius:18px}
input{width:100%;padding:14px;margin:10px 0 18px;background:#0b0b0b;border:1px solid #333;color:white;border-radius:8px}
button{width:100%;padding:14px;background:#ff6422;border:0;border-radius:8px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><div class="card">
<h1>Reset Password</h1>
<input type="password" placeholder="New password">
<input type="password" placeholder="Confirm password">
<button>Update Password</button>
</div></main>
</body>
</html>
