<!DOCTYPE html>
<html>
<head>
<title>CSS 175 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:40px 7%}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#151515;border:1px solid #2a2a2a;border-radius:15px;padding:25px}.value{font-size:30px;color:#ff6422}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><h1>Model Performance</h1><div class="grid">
<div class="card">Accuracy<div class="value">94%</div></div>
<div class="card">Precision<div class="value">91%</div></div>
<div class="card">Recall<div class="value">89%</div></div>
<div class="card">F1 Score<div class="value">90%</div></div>
</div></main>
</body>
</html>
