<!DOCTYPE html>
<html>
<head>
<title>CSS 182 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{padding:20px 7%;background:#111;border-bottom:1px solid #2a2a2a}.logo span{color:#ff6422}
main{max-width:1000px;margin:50px auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:15px;padding:22px}h1{color:#ff6422}
.value{font-size:28px;font-weight:bold;margin-top:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav><b class="logo">Dev<span>Core.</span></b></nav>
<main><h1>ML Experiment Dashboard</h1><div class="grid">
<div class="card">Experiment<div class="value">EXP-042</div></div>
<div class="card">Accuracy<div class="value">94.8%</div></div>
<div class="card">F1 Score<div class="value">0.92</div></div>
</div></main>
</body>
</html>
