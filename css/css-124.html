<!DOCTYPE html>
<html>
<head>
<title>CSS 124 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:700px;margin:70px auto;padding:20px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:18px;padding:30px}
.badge{display:inline-block;background:#ff6422;color:#111;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.answer{background:#0f0f0f;border-left:3px solid #ff6422;padding:18px;margin-top:20px;color:#ccc}
.actions{margin-top:20px;color:#999}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<div class="card">
<span class="badge">AI RESPONSE</span>
<h1>Dashboard Summary</h1>
<div class="answer">
Revenue increased during the selected period, while active users also showed steady growth.
</div>
<div class="actions">Copy &nbsp; · &nbsp; Regenerate &nbsp; · &nbsp; Share</div>
</div>
</main>
</body>
</html>
