<!DOCTYPE html>
<html>
<head>
<title>CSS 133 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:850px;margin:60px auto;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:25px;color:#aaa}
h2{color:white}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><h1>AI Document Summarizer</h1><div class="grid">
<div class="card"><h2>Document</h2><p>Long project documentation and analytics information...</p></div>
<div class="card"><h2>AI Summary</h2><p>The document explains project goals, features and performance metrics.</p></div>
</div></main>
</body>
</html>
