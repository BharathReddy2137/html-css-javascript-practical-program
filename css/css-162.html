<!DOCTYPE html>
<html>
<head>
<title>CSS 162 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:45px 7%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.agent{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:25px;text-align:center}
.agent:hover{border-color:#ff6422}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><h1>Multi-Agent Workflow</h1><div class="grid">
<div class="agent"><h2>Research</h2><p>Collect information</p></div>
<div class="agent"><h2>Analysis</h2><p>Process information</p></div>
<div class="agent"><h2>Writer</h2><p>Generate output</p></div>
</div></main>
</body>
</html>
