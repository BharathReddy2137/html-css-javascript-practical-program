<!DOCTYPE html>
<html>
<head>
<title>CSS 121 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:850px;margin:50px auto;padding:20px}
.search{background:#151515;border:1px solid #333;padding:15px;border-radius:10px}
.results{margin-top:20px}
.result{padding:22px;background:#151515;border:1px solid #2a2a2a;border-radius:14px;margin:12px 0}
.tag{color:#ff6422;font-size:12px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>AI Search Results</h1>
<div class="search">How can I improve SaaS conversion?</div>
<div class="results">
<div class="result"><div class="tag">AI INSIGHT</div><h2>Improve onboarding</h2><p style="color:#999">Simplify the first steps and highlight important product features.</p></div>
<div class="result"><div class="tag">AI INSIGHT</div><h2>Reduce friction</h2><p style="color:#999">Keep forms short and make important actions easy to discover.</p></div>
</div>
</main>
</body>
</html>
