<!DOCTYPE html>
<html>
<head>
<title>CSS 98 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:40px 6%}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:25px}
.num{font-size:30px;font-weight:bold}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>Marketing Analytics</h1>
<div class="grid">
<div class="card"><small>Impressions</small><div class="num">2.4M</div></div>
<div class="card"><small>Clicks</small><div class="num">84K</div></div>
<div class="card"><small>CTR</small><div class="num">3.5%</div></div>
<div class="card"><small>Leads</small><div class="num">8,420</div></div>
</div>
</main>
</body>
</html>
