<!DOCTYPE html>
<html>
<head>
<title>CSS 147 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:750px;margin:60px auto;padding:20px}.agent{display:flex;justify-content:space-between;align-items:center;background:#151515;border:1px solid #2a2a2a;padding:20px;border-radius:14px;margin:12px 0}
.status{color:#ff6422}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><h1>AI Agents</h1>
<div class="agent"><b>Research Agent</b><span class="status">Online</span></div>
<div class="agent"><b>Data Agent</b><span class="status">Online</span></div>
<div class="agent"><b>Support Agent</b><span class="status">Idle</span></div>
</main>
</body>
</html>
