<!DOCTYPE html>
<html><head><title>CSS 228 | DevCore</title>
<style>
body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial;display:grid;place-items:center;min-height:100vh}.cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.card{width:220px;padding:30px;background:#151515;border:1px solid #2a2a2a;border-radius:16px;text-align:center;transition:.3s}.card:hover{transform:translateY(-12px);box-shadow:0 15px 40px #ff642233;border-color:#ff6422}
button{padding:12px 20px;background:#ff6422;border:0;border-radius:8px;transition:.3s}button:hover{transform:scale(1.08)}
</style></head><body><div class="cards"><div class="card"><h2>Hover Me</h2><p>Micro interaction</p><button>Explore</button></div></div></body></html>
