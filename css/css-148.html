<!DOCTYPE html>
<html>
<head>
<title>CSS 148 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:550px;margin:60px auto;padding:20px}.profile{background:#151515;border:1px solid #2a2a2a;border-radius:18px;padding:35px;text-align:center}
.avatar{width:90px;height:90px;border-radius:50%;background:#ff6422;color:#111;display:grid;place-items:center;font-size:30px;font-weight:bold;margin:auto}
.tag{color:#ff6422}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><div class="profile"><div class="avatar">AI</div><h1>Research Agent</h1><div class="tag">AUTONOMOUS AGENT</div><p style="color:#999">Analyzes documents and generates research summaries.</p></div></main>
</body>
</html>
