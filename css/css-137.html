<!DOCTYPE html>
<html>
<head>
<title>CSS 137 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:850px;margin:50px auto;padding:20px}.card{background:#151515;border:1px solid #2a2a2a;padding:25px;border-radius:16px}
input{width:100%;padding:15px;background:#0b0b0b;border:1px solid #333;color:white;border-radius:9px}.chart{height:200px;display:flex;align-items:end;gap:12px;margin-top:25px}.chart i{flex:1;background:#ff6422}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><div class="card"><h1>Text to Chart</h1><input value="Show monthly sales">
<div class="chart"><i style="height:35%"></i><i style="height:55%"></i><i style="height:70%"></i><i style="height:90%"></i><i style="height:65%"></i></div>
</div></main>
</body>
</html>
