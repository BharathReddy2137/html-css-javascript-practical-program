<!DOCTYPE html>
<html>
<head>
<title>CSS 108 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:40px 6%}
.charts{display:flex;gap:50px;justify-content:center;flex-wrap:wrap}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:30px;text-align:center}
.pie{width:200px;height:200px;border-radius:50%;background:conic-gradient(#ff6422 0 45%,#444 45% 70%,#777 70% 100%)}
.donut{width:200px;height:200px;border-radius:50%;background:conic-gradient(#ff6422 0 65%,#444 65% 100%);position:relative}
.donut:after{content:"65%";position:absolute;inset:40px;background:#151515;border-radius:50%;display:grid;place-items:center;font-size:25px;font-weight:bold}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>Pie & Donut Charts</h1>
<div class="charts">
<div class="card"><h2>Traffic</h2><div class="pie"></div></div>
<div class="card"><h2>Conversion</h2><div class="donut"></div></div>
</div>
</main>
</body>
</html>
