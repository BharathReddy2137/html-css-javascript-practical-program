<!DOCTYPE html>
<html>
<head>
<title>CSS 165 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:40px 7%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#151515;border:1px solid #2a2a2a;border-radius:15px;padding:25px}.value{font-size:34px;font-weight:bold}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><h1>ML Prediction Dashboard</h1><div class="grid">
<div class="card"><small>Predictions</small><div class="value">18,420</div></div>
<div class="card"><small>Accuracy</small><div class="value">94.2%</div></div>
<div class="card"><small>Confidence</small><div class="value">91%</div></div>
</div></main>
</body>
</html>
