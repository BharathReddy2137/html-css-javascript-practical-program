<!DOCTYPE html>
<html>
<head>
<title>CSS 118 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
.layout{display:grid;grid-template-columns:240px 1fr;height:100vh}
aside{background:#111;border-right:1px solid #2a2a2a;padding:25px}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
.item{padding:14px 10px;color:#aaa;border-radius:8px;margin:8px 0}
.item:hover{background:#222;color:white}
main{padding:50px;max-width:800px}
.chat{background:#151515;border:1px solid #2a2a2a;padding:25px;border-radius:16px}
</style>
</head>
<body>
<div class="layout">
<aside>
<div class="logo">Dev<span>Core.</span></div>
<h3>AI Chats</h3>
<div class="item">New Chat</div>
<div class="item">Analytics Help</div>
<div class="item">Project Ideas</div>
<div class="item">Code Review</div>
</aside>
<main>
<h1>AI Chat Workspace</h1>
<div class="chat">
<h2>Hello 👋</h2>
<p style="color:#999">Choose a conversation from the sidebar or start a new one.</p>
</div>
</main>
</div>
</body>
</html>
