<!DOCTYPE html>
<html>
<head>
<title>CSS 113 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:40px 6%}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.widget{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:22px;min-height:150px}
.handle{float:right;color:#999}
.value{font-size:32px;font-weight:bold}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>Dashboard Widgets</h1>
<div class="grid">
<div class="widget"><span class="handle">⋮⋮</span><small>Revenue</small><div class="value">$82K</div></div>
<div class="widget"><span class="handle">⋮⋮</span><small>Users</small><div class="value">18.4K</div></div>
<div class="widget"><span class="handle">⋮⋮</span><small>Orders</small><div class="value">4,820</div></div>
</div>
</main>
</body>
</html>
