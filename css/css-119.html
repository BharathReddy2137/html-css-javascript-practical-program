<!DOCTYPE html>
<html>
<head>
<title>CSS 119 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:700px;margin:100px auto;padding:20px}
.command{background:#151515;border:1px solid #444;border-radius:15px;box-shadow:0 20px 50px #000;padding:15px}
input{width:100%;padding:17px;background:transparent;border:0;color:white;font-size:18px;outline:none}
.option{padding:13px;border-radius:8px;color:#aaa}
.option:hover{background:#242424;color:white}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>AI Command Bar</h1>
<div class="command">
<input placeholder="Ask AI or type a command...">
<div class="option">⌘ Generate report</div>
<div class="option">⌘ Analyze dashboard</div>
<div class="option">⌘ Create summary</div>
</div>
</main>
</body>
</html>
