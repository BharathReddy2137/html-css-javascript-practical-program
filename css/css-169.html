<!DOCTYPE html>
<html>
<head>
<title>CSS 169 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:40px 7%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#151515;border:1px solid #2a2a2a;border-radius:15px;padding:25px}.score{font-size:38px;color:#ff6422}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><h1>ML Risk Dashboard</h1><div class="grid">
<div class="card"><small>Customer Risk</small><div class="score">24%</div></div>
<div class="card"><small>Transaction Risk</small><div class="score">8%</div></div>
<div class="card"><small>System Risk</small><div class="score">12%</div></div>
</div></main>
</body>
</html>
