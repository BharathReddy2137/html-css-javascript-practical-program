<!DOCTYPE html>
<html>
<head>
<title>CSS 102 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:850px;margin:50px auto;padding:20px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:30px}
.funnel{display:flex;flex-direction:column;align-items:center;gap:8px}
.stage{padding:18px;text-align:center;background:#ff6422;color:#111;font-weight:bold;border-radius:8px}
.s1{width:100%}.s2{width:82%}.s3{width:64%}.s4{width:46%}.s5{width:30%}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>Conversion Funnel</h1>
<div class="card">
<div class="funnel">
<div class="stage s1">Visitors — 100,000</div>
<div class="stage s2">Signups — 82,000</div>
<div class="stage s3">Activated — 64,000</div>
<div class="stage s4">Trial — 46,000</div>
<div class="stage s5">Customers — 30,000</div>
</div>
</div>
</main>
</body>
</html>
