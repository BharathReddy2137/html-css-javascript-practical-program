<!DOCTYPE html>
<html>
<head>
<title>CSS 111 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:700px;margin:70px auto;padding:20px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:30px}
.filters{display:flex;gap:15px;flex-wrap:wrap}
input{padding:14px;background:#0b0b0b;border:1px solid #333;color:white;border-radius:8px}
button{padding:14px 25px;background:#ff6422;border:0;border-radius:8px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>Date Range Filter</h1>
<div class="card">
<div class="filters">
<input type="date" value="2026-09-01">
<input type="date" value="2026-09-21">
<button>Apply Filter</button>
</div>
</div>
</main>
</body>
</html>
