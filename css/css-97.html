<!DOCTYPE html>
<html>
<head>
<title>CSS 97 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:40px 6%}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:25px}
.progress{height:9px;background:#292929;border-radius:20px}.fill{height:100%;background:#ff6422;border-radius:20px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>Product Analytics</h1>
<div class="grid">
<div class="card"><h3>Feature Usage</h3><p>Dashboard</p><div class="progress"><div class="fill" style="width:90%"></div></div><p>90%</p></div>
<div class="card"><h3>Feature Usage</h3><p>Reports</p><div class="progress"><div class="fill" style="width:68%"></div></div><p>68%</p></div>
<div class="card"><h3>Feature Usage</h3><p>Integrations</p><div class="progress"><div class="fill" style="width:52%"></div></div><p>52%</p></div>
</div>
</main>
</body>
</html>
