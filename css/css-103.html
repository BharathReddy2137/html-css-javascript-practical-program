<!DOCTYPE html>
<html>
<head>
<title>CSS 103 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:40px 6%}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:25px;overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:15px;border:1px solid #2a2a2a;text-align:center}
th{color:#999}
.hot{background:#ff6422;color:#111;font-weight:bold}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>Retention & Cohort Analytics</h1>
<div class="card">
<table>
<tr><th>Cohort</th><th>Week 0</th><th>Week 1</th><th>Week 2</th><th>Week 3</th><th>Week 4</th></tr>
<tr><td>Jan</td><td class="hot">100%</td><td>82%</td><td>74%</td><td>68%</td><td>61%</td></tr>
<tr><td>Feb</td><td class="hot">100%</td><td>85%</td><td>77%</td><td>70%</td><td>65%</td></tr>
<tr><td>Mar</td><td class="hot">100%</td><td>88%</td><td>80%</td><td>73%</td><td>68%</td></tr>
</table>
</div>
</main>
</body>
</html>
