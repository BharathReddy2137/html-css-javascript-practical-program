<!DOCTYPE html>
<html>
<head>
<title>CSS 89 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 5%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:35px 5%}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:15px;padding:25px}
.num{font-size:30px;font-weight:bold}.muted{color:#999}
.chart{height:180px;display:flex;align-items:end;gap:12px}
.bar{flex:1;background:#ff6422;border-radius:6px 6px 0 0}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>SaaS Dashboard</h1>
<p class="muted">Overview of your workspace.</p>
<div class="grid">
<div class="card"><p class="muted">Revenue</p><div class="num">$48.2K</div></div>
<div class="card"><p class="muted">Users</p><div class="num">12,840</div></div>
<div class="card"><p class="muted">Orders</p><div class="num">1,284</div></div>
<div class="card"><p class="muted">Growth</p><div class="num">+18%</div></div>
</div>
<div class="card" style="margin-top:20px">
<h2>Weekly Activity</h2>
<div class="chart">
<div class="bar" style="height:40%"></div>
<div class="bar" style="height:65%"></div>
<div class="bar" style="height:50%"></div>
<div class="bar" style="height:85%"></div>
<div class="bar" style="height:70%"></div>
<div class="bar" style="height:95%"></div>
<div class="bar" style="height:75%"></div>
</div>
</div>
</main>
</body>
</html>
