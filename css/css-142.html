<!DOCTYPE html>
<html>
<head>
<title>CSS 142 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}

.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}

<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><h1>Anomaly Detection</h1>
<div class="alert"><b>⚠ Anomaly detected</b><p class="muted">Traffic is significantly higher than the normal range.</p></div>
<div class="alert"><b>⚠ Unusual activity</b><p class="muted">API requests exceeded the expected threshold.</p></div>
</main>
</body>
</html>
