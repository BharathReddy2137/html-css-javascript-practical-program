<!DOCTYPE html>
<html>
<head>
<title>CSS 104 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:40px 6%}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:25px}
.chart{height:250px;display:flex;align-items:end;gap:14px;border-bottom:1px solid #444}
.bar{flex:1;background:#ff6422;border-radius:5px 5px 0 0}
.label{color:#999;text-align:center;font-size:12px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>Revenue Chart</h1>
<div class="card">
<h2>$284,620</h2>
<div class="chart">
<div style="height:35%" class="bar"></div>
<div style="height:48%" class="bar"></div>
<div style="height:42%" class="bar"></div>
<div style="height:65%" class="bar"></div>
<div style="height:72%" class="bar"></div>
<div style="height:90%" class="bar"></div>
</div>
<p class="label">Jan &nbsp; Feb &nbsp; Mar &nbsp; Apr &nbsp; May &nbsp; Jun</p>
</div>
</main>
</body>
</html>
