<!DOCTYPE html>
<html>
<head>
<title>CSS 83 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:430px;margin:90px auto;padding:20px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:18px;padding:35px}
input{width:100%;padding:14px;margin:15px 0;background:#0b0b0b;border:1px solid #333;color:white;border-radius:8px}
button{width:100%;padding:14px;background:#ff6422;border:0;border-radius:8px}
p{color:#999}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><div class="card">
<h1>Forgot Password?</h1>
<p>Enter your email and we'll send password reset instructions.</p>
<input type="email" placeholder="Email address">
<button>Send Reset Link</button>
</div></main>
</body>
</html>
