<!DOCTYPE html>
<html>
<head>
<title>CSS 184 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial}
nav{padding:20px 7%;background:#111}.logo span{color:#ff6422}
main{max-width:650px;margin:50px auto}.profile{background:#151515;border:1px solid #2a2a2a;border-radius:18px;padding:30px}
.avatar{width:80px;height:80px;border-radius:50%;background:#ff6422;display:grid;place-items:center;font-size:28px;font-weight:bold}
input{width:100%;margin:10px 0;padding:13px;background:#0b0b0b;color:white;border:1px solid #333;border-radius:8px}
button{background:#ff6422;border:0;padding:12px 22px;border-radius:8px}
</style>
</head>
<body><nav><b class="logo">Dev<span>Core.</span></b></nav>
<main><div class="profile"><div class="avatar">j</div><h1>Profile Settings</h1>
<input placeholder="Full Name"><input placeholder="Job Title"><input placeholder="Bio"><button>Update Profile</button>
</div></main></body></html>
