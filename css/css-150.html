<!DOCTYPE html>
<html>
<head>
<title>CSS 150 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:800px;margin:60px auto;padding:20px}.task{background:#151515;border:1px solid #2a2a2a;padding:20px;border-radius:14px;margin:12px 0;display:flex;justify-content:space-between}
.badge{background:#ff6422;color:#111;padding:5px 10px;border-radius:15px;font-size:12px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><h1>Agent Task Queue</h1>
<div class="task">Analyze sales data <span class="badge">RUNNING</span></div>
<div class="task">Generate report <span class="badge">QUEUED</span></div>
<div class="task">Check anomalies <span class="badge">QUEUED</span></div>
</main>
</body>
</html>
