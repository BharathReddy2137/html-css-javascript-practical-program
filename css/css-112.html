<!DOCTYPE html>
<html>
<head>
<title>CSS 112 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:700px;margin:60px auto;padding:20px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:30px}
select{width:100%;padding:13px;margin:8px 0 18px;background:#0b0b0b;color:white;border:1px solid #333;border-radius:8px}
button{padding:13px 25px;background:#ff6422;border:0;border-radius:8px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>Filter & Sort</h1>
<div class="card">
<label>Category</label>
<select><option>All Products</option><option>Software</option><option>Services</option></select>
<label>Status</label>
<select><option>All Status</option><option>Active</option><option>Pending</option></select>
<label>Sort By</label>
<select><option>Newest</option><option>Oldest</option><option>Revenue</option></select>
<button>Apply Filters</button>
</div>
</main>
</body>
</html>
