<!DOCTYPE html>
<html>
<head>
<title>CSS 134 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:40px 7%}.grid{display:grid;grid-template-columns:1fr 2fr;gap:20px}.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:25px}
button{padding:12px 20px;background:#ff6422;border:0;border-radius:8px}.chart{height:180px;display:flex;align-items:end;gap:10px}.chart i{flex:1;background:#ff6422}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><h1>AI Data Analysis</h1><div class="grid">
<div class="card"><h2>Ask AI</h2><p style="color:#999">What changed this month?</p><button>Analyze</button></div>
<div class="card"><h2>Analysis</h2><div class="chart"><i style="height:40%"></i><i style="height:65%"></i><i style="height:85%"></i><i style="height:55%"></i></div></div>
</div></main>
</body>
</html>
