<!DOCTYPE html>
<html>
<head>
<title>CSS 96 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:40px 6%}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#151515;border:1px solid #2a2a2a;padding:25px;border-radius:16px}
.big{font-size:34px;font-weight:bold}
table{width:100%;border-collapse:collapse;margin-top:20px}
td,th{padding:14px;border-bottom:1px solid #2a2a2a;text-align:left}
th{color:#999}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>Customer Analytics</h1>
<div class="grid">
<div class="card"><small>Customers</small><div class="big">14,280</div></div>
<div class="card"><small>Churn Rate</small><div class="big">2.4%</div></div>
<div class="card"><small>LTV</small><div class="big">$840</div></div>
</div>
<div class="card" style="margin-top:20px">
<table>
<tr><th>Customer</th><th>Plan</th><th>Value</th></tr>
<tr><td>Acme Inc.</td><td>Pro</td><td>$4,200</td></tr>
<tr><td>Nova Labs</td><td>Business</td><td>$8,400</td></tr>
<tr><td>Orbit Co.</td><td>Starter</td><td>$1,200</td></tr>
</table>
</div>
</main>
</body>
</html>
