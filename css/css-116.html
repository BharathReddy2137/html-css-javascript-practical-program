<!DOCTYPE html>
<html>
<head>
<title>CSS 116 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:800px;margin:50px auto;padding:20px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:18px;padding:25px}
.message{padding:15px;border-radius:12px;margin:12px 0;max-width:75%}
.ai{background:#222}.user{background:#ff6422;color:#111;margin-left:auto}
input{width:100%;padding:15px;background:#0b0b0b;border:1px solid #333;color:white;border-radius:10px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>AI Assistant</h1>
<div class="card">
<div class="message ai">Hello! How can I help you today?</div>
<div class="message user">Show me my analytics.</div>
<div class="message ai">Here is a summary of your latest analytics.</div>
<input placeholder="Ask AI anything...">
</div>
</main>
</body>
</html>
