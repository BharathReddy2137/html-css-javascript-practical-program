<!DOCTYPE html>
<html>
<head>
<title>CSS 181 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{padding:20px 7%;background:#111;border-bottom:1px solid #2a2a2a}.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:850px;margin:60px auto;padding:20px}.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:28px}
h1{color:#ff6422}.reason{padding:15px;border-left:4px solid #ff6422;margin:12px 0;background:#111}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><div class="card">
<h1>ML Prediction Explanation</h1>
<p>Prediction: Customer will renew subscription.</p>
<div class="reason">Usage frequency <b>+35%</b></div>
<div class="reason">Customer activity <b>+28%</b></div>
<div class="reason">Support history <b>+17%</b></div>
</div></main>
</body>
</html>
