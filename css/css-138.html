<!DOCTYPE html>
<html>
<head>
<title>CSS 138 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:800px;margin:60px auto;padding:20px}.card{background:#151515;border:1px solid #2a2a2a;padding:30px;border-radius:16px}
.row{display:flex;justify-content:space-between;padding:15px;border-bottom:1px solid #2a2a2a}.tag{color:#ff6422}
button{margin-top:20px;padding:13px 22px;background:#ff6422;border:0;border-radius:8px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><div class="card"><span class="tag">AI GENERATED</span><h1>Monthly Analytics Report</h1>
<div class="row">Revenue <b>$82K</b></div><div class="row">Users <b>18.4K</b></div><div class="row">Conversion <b>8.4%</b></div>
<button>Generate Report</button></div></main>
</body>
</html>
