<!DOCTYPE html>
<html>
<head>
<title>CSS 170 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:850px;margin:60px auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#151515;border:1px solid #2a2a2a;padding:25px;border-radius:16px}.tag{color:#ff6422}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><h1>Recommendation Engine</h1><div class="grid">
<div class="card"><span class="tag">92% MATCH</span><h2>Analytics Pro</h2><p style="color:#999">Recommended based on usage.</p></div>
<div class="card"><span class="tag">86% MATCH</span><h2>Team Plan</h2><p style="color:#999">Recommended for collaboration.</p></div>
<div class="card"><span class="tag">81% MATCH</span><h2>AI Pack</h2><p style="color:#999">Recommended for automation.</p></div>
</div></main>
</body>
</html>
