<!DOCTYPE html>
<html>
<head>
<title>CSS 114 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:35px 6%}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:22px}
.wide{grid-column:span 2}
.num{font-size:30px;font-weight:bold}
.chart{height:120px;display:flex;align-items:end;gap:8px}
.chart i{flex:1;background:#ff6422}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>Custom Analytics Dashboard</h1>
<div class="grid">
<div class="card"><small>Revenue</small><div class="num">$92K</div></div>
<div class="card"><small>Users</small><div class="num">18K</div></div>
<div class="card"><small>Orders</small><div class="num">4.2K</div></div>
<div class="card"><small>Growth</small><div class="num">18%</div></div>
<div class="card wide">
<h3>Performance</h3>
<div class="chart">
<i style="height:40%"></i><i style="height:70%"></i><i style="height:50%"></i><i style="height:90%"></i><i style="height:75%"></i>
</div>
</div>
<div class="card wide"><h3>Insights</h3><p style="color:#999">Revenue increased consistently across the selected period.</p></div>
</div>
</main>
</body>
</html>
