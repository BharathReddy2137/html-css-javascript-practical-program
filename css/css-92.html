<!DOCTYPE html>
<html>
<head>
<title>CSS 92 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:40px 6%}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:25px}
.kpi{font-size:34px;font-weight:bold}.up{color:#ff6422;font-size:13px}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>KPI Analytics</h1>
<div class="grid">
<div class="card"><small>MRR</small><div class="kpi">$82K</div><div class="up">↑ 12.4%</div></div>
<div class="card"><small>ARR</small><div class="kpi">$984K</div><div class="up">↑ 9.8%</div></div>
<div class="card"><small>Users</small><div class="kpi">18.4K</div><div class="up">↑ 15.2%</div></div>
<div class="card"><small>Retention</small><div class="kpi">91%</div><div class="up">↑ 4.1%</div></div>
</div>
</main>
</body>
</html>
