<!DOCTYPE html>
<html>
<head>
<title>CSS 93 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:40px 6%}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:25px;margin-bottom:20px}
.revenue{font-size:40px;font-weight:bold}
.bars{height:220px;display:flex;align-items:end;gap:14px}
.bars div{flex:1;background:#ff6422;border-radius:5px 5px 0 0}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>Revenue Analytics</h1>
<div class="card"><small>Total Revenue</small><div class="revenue">$284,620</div></div>
<div class="card">
<h2>Monthly Revenue</h2>
<div class="bars">
<div style="height:35%"></div><div style="height:48%"></div><div style="height:55%"></div>
<div style="height:65%"></div><div style="height:75%"></div><div style="height:90%"></div>
</div>
</div>
</main>
</body>
</html>
