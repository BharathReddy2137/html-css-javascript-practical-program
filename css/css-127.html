<!DOCTYPE html>
<html>
<head>
<title>CSS 127 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:800px;margin:60px auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:22px}.tag{color:#ff6422;font-size:12px}
button{background:#ff6422;border:0;padding:10px 18px;border-radius:8px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><h1>AI Recommendations</h1><div class="grid">
<div class="card"><span class="tag">RECOMMENDED</span><h2>Improve Onboarding</h2><p>Reduce unnecessary steps.</p><button>View</button></div>
<div class="card"><span class="tag">RECOMMENDED</span><h2>Optimize Search</h2><p>Improve result relevance.</p><button>View</button></div>
<div class="card"><span class="tag">RECOMMENDED</span><h2>Track Retention</h2><p>Add cohort analytics.</p><button>View</button></div>
</div></main>
</body>
</html>
