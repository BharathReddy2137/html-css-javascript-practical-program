<!DOCTYPE html>
<html>
<head>
<title>CSS 153 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:650px;margin:60px auto;padding:20px}.timeline{border-left:3px solid #ff6422;padding-left:25px}
.item{background:#151515;border:1px solid #2a2a2a;padding:18px;border-radius:12px;margin:20px 0}
.time{color:#ff6422}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><h1>Execution Timeline</h1><div class="timeline">
<div class="item"><span class="time">01</span><h3>Task Created</h3></div>
<div class="item"><span class="time">02</span><h3>Agent Started</h3></div>
<div class="item"><span class="time">03</span><h3>Processing</h3></div>
<div class="item"><span class="time">04</span><h3>Completed</h3></div>
</div></main>
</body>
</html>
