<!DOCTYPE html>
<html>
<head>
<title>CSS 183 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{padding:20px 7%;background:#111;border-bottom:1px solid #2a2a2a}.logo span{color:#ff6422}
main{max-width:700px;margin:50px auto;padding:20px}.card{background:#151515;padding:30px;border:1px solid #2a2a2a;border-radius:16px}
label{display:block;margin:15px 0 7px}input{width:100%;padding:13px;background:#0b0b0b;color:white;border:1px solid #333;border-radius:8px}
button{margin-top:20px;padding:12px 20px;background:#ff6422;border:0;border-radius:8px;font-weight:bold}
</style>
</head>
<body><nav><b class="logo">Dev<span>Core.</span></b></nav>
<main><div class="card"><h1>Account Settings</h1>
<label>Name</label><input value="john doe">
<label>Email</label><input value="user@example.com">
<label>Language</label><input value="English">
<button>Save Changes</button></div></main>
</body>
</html>
