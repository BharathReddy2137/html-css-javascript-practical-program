<!DOCTYPE html>
<html>
<head>
<title>CSS 105 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:900px;margin:50px auto;padding:20px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:30px}
svg{width:100%;height:250px}
path{fill:none;stroke:#ff6422;stroke-width:5}
.gridline{stroke:#333;stroke-width:1}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>Line Chart Analytics</h1>
<div class="card">
<svg viewBox="0 0 800 250">
<line x1="20" y1="40" x2="780" y2="40" class="gridline"/>
<line x1="20" y1="120" x2="780" y2="120" class="gridline"/>
<line x1="20" y1="200" x2="780" y2="200" class="gridline"/>
<path d="M20 190 L150 145 L280 165 L410 90 L540 120 L680 55 L780 80"/>
</svg>
</div>
</main>
</body>
</html>
