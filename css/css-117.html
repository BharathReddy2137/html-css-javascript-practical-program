<!DOCTYPE html>
<html>
<head>
<title>CSS 117 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:750px;margin:40px auto;padding:20px}
.chat{background:#151515;border:1px solid #2a2a2a;border-radius:18px;overflow:hidden}
.messages{padding:25px;min-height:400px}
.msg{padding:14px 18px;border-radius:15px;margin:15px 0;max-width:70%}
.ai{background:#242424}.user{background:#ff6422;color:#111;margin-left:auto}
.input{padding:15px;border-top:1px solid #2a2a2a}
input{width:100%;padding:13px;background:#0b0b0b;border:1px solid #333;color:white;border-radius:8px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>AI Chat</h1>
<div class="chat">
<div class="messages">
<div class="msg ai">Welcome to DevCore AI.</div>
<div class="msg user">Explain this dashboard.</div>
<div class="msg ai">This dashboard shows revenue, users and conversion metrics.</div>
</div>
<div class="input"><input placeholder="Type a message..."></div>
</div>
</main>
</body>
</html>
