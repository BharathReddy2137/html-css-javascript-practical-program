<!DOCTYPE html>
<html>
<head>
<title>CSS 120 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:800px;margin:70px auto;padding:20px}
.search{display:flex;gap:10px}
input{flex:1;padding:16px;background:#151515;border:1px solid #333;color:white;border-radius:10px}
button{padding:15px 25px;background:#ff6422;border:0;border-radius:10px}
.result{background:#151515;border:1px solid #2a2a2a;border-radius:12px;padding:20px;margin-top:15px}
.result small{color:#ff6422}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>AI-Powered Search</h1>
<div class="search">
<input placeholder="Search anything...">
<button>Search</button>
</div>
<div class="result"><small>AI RESULT</small><h2>Analytics Dashboard</h2><p style="color:#999">A dashboard containing revenue, users and performance metrics.</p></div>
<div class="result"><small>AI RESULT</small><h2>Revenue Report</h2><p style="color:#999">Monthly revenue increased during the selected period.</p></div>
</main>
</body>
</html>
