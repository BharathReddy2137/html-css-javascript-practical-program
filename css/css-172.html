<!DOCTYPE html>
<html>
<head>
<title>CSS 172 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:850px;margin:50px auto;padding:20px}.chart{height:300px;background:#151515;border:1px solid #2a2a2a;border-radius:16px;position:relative}
.dot{width:12px;height:12px;background:#777;border-radius:50%;position:absolute}.outlier{background:#ff6422;width:18px;height:18px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><h1>Outlier Detection</h1><div class="chart">
<div class="dot" style="left:15%;top:60%"></div><div class="dot" style="left:30%;top:45%"></div>
<div class="dot" style="left:45%;top:55%"></div><div class="dot" style="left:60%;top:50%"></div>
<div class="dot outlier" style="left:85%;top:15%"></div>
</div></main>
</body>
</html>
