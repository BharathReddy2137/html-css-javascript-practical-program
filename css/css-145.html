<!DOCTYPE html>
<html>
<head>
<title>CSS 145 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:800px;margin:60px auto;padding:20px}.card{background:#151515;border:1px solid #2a2a2a;padding:25px;border-radius:16px}
.step{border-left:3px solid #ff6422;padding:15px;margin:15px 0;color:#aaa}.step b{color:white}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><div class="card"><h1>AI Explanation</h1>
<div class="step"><b>Step 1</b><br>Analyze the input data.</div>
<div class="step"><b>Step 2</b><br>Compare relevant patterns.</div>
<div class="step"><b>Step 3</b><br>Generate the final result.</div>
</div></main>
</body>
</html>
