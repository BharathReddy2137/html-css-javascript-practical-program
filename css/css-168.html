<!DOCTYPE html>
<html>
<head>
<title>CSS 168 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:600px;margin:70px auto;padding:20px}.card{background:#151515;border:1px solid #2a2a2a;border-radius:18px;padding:35px}
.progress{height:15px;background:#292929;border-radius:20px}.fill{height:100%;width:93%;background:#ff6422;border-radius:20px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><div class="card"><h1>Model Confidence</h1><p>Confidence Level</p><div class="progress"><div class="fill"></div></div><h2>93%</h2></div></main>
</body>
</html>
