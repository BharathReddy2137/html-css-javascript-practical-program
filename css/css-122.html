<!DOCTYPE html>
<html>
<head>
<title>CSS 122 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:750px;margin:100px auto;padding:20px;text-align:center}
.prompt{background:#151515;border:1px solid #444;border-radius:18px;padding:15px;display:flex;gap:10px}
textarea{flex:1;background:transparent;border:0;outline:0;color:white;resize:none;font-size:17px;padding:10px}
button{background:#ff6422;border:0;border-radius:10px;padding:12px 20px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>What would you like to create?</h1>
<p style="color:#999">Write a prompt for the AI assistant.</p>
<div class="prompt">
<textarea rows="3" placeholder="Describe your idea..."></textarea>
<button>Generate</button>
</div>
</main>
</body>
</html>
