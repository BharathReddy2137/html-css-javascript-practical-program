<!DOCTYPE html>
<html>
<head>
<title>CSS 136 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:850px;margin:60px auto;padding:20px}.card{background:#151515;border:1px solid #2a2a2a;padding:30px;border-radius:18px}
.questions{display:flex;gap:10px;flex-wrap:wrap}.q{padding:12px;background:#222;border-radius:20px;color:#bbb}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><div class="card"><h1>Ask Your Data</h1><p style="color:#999">Ask questions using everyday language.</p>
<div class="questions"><div class="q">What is my revenue?</div><div class="q">Which product grew fastest?</div><div class="q">Show active users.</div></div>
</div></main>
</body>
</html>
