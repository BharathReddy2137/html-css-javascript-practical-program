<!DOCTYPE html>
<html>
<head>
<title>CSS 95 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:40px 6%}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:#151515;border:1px solid #2a2a2a;padding:25px;border-radius:16px}
.num{font-size:30px;font-weight:bold}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>User Analytics</h1>
<div class="grid">
<div class="card"><small>Total Users</small><h2 class="num">24,840</h2></div>
<div class="card"><small>New Users</small><h2 class="num">2,480</h2></div>
<div class="card"><small>Active Users</small><h2 class="num">18,920</h2></div>
<div class="card"><small>Returning</small><h2 class="num">12,540</h2></div>
</div>
</main>
</body>
</html>
