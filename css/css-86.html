<!DOCTYPE html>
<html>
<head>
<title>CSS 86 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 8%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:650px;margin:70px auto;padding:20px}
.card{background:#151515;border:1px solid #2a2a2a;padding:35px;border-radius:18px}
input,textarea{width:100%;padding:14px;margin:8px 0 18px;background:#0b0b0b;border:1px solid #333;color:white;border-radius:8px}
textarea{height:130px;resize:vertical}
button{padding:14px 30px;background:#ff6422;border:0;border-radius:8px}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><div class="card">
<h1>Contact Us</h1>
<input placeholder="Your Name">
<input type="email" placeholder="Email Address">
<input placeholder="Subject">
<textarea placeholder="Write your message..."></textarea>
<button>Send Message</button>
</div></main>
</body>
</html>
