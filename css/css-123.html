<!DOCTYPE html>
<html>
<head>
<title>CSS 123 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:800px;margin:80px auto;padding:20px;text-align:center}
.suggestions{display:flex;gap:15px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.card{background:#151515;border:1px solid #2a2a2a;padding:20px;border-radius:14px;width:220px;text-align:left}
.card:hover{border-color:#ff6422;transform:translateY(-3px)}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>Prompt Suggestions</h1>
<p style="color:#999">Try one of these prompts.</p>
<div class="suggestions">
<div class="card">📊 Analyze my dashboard</div>
<div class="card">📝 Summarize this report</div>
<div class="card">💡 Generate project ideas</div>
<div class="card">🔍 Find important insights</div>
</div>
</main>
</body>
</html>
