<!DOCTYPE html>
<html>
<head>
<title>CSS 101 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f5f5;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;padding:0 6%}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:40px 6%}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:25px}
.num{font-size:32px;font-weight:bold}
.bar{height:9px;background:#292929;border-radius:20px;margin-top:12px}
.fill{height:100%;background:#ff6422;border-radius:20px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>SaaS Usage Analytics</h1>
<div class="grid">
<div class="card"><small>Active Workspaces</small><div class="num">4,820</div></div>
<div class="card"><small>API Calls</small><div class="num">2.8M</div></div>
<div class="card"><small>Storage Used</small><div class="num">68%</div></div>
</div>

<div class="card" style="margin-top:20px">
<h2>Resource Usage</h2>
<p>API Usage</p>
<div class="bar"><div class="fill" style="width:78%"></div></div>
<p>Storage</p>
<div class="bar"><div class="fill" style="width:68%"></div></div>
<p>Team Seats</p>
<div class="bar"><div class="fill" style="width:54%"></div></div>
</div>
</main>
</body>
</html>
