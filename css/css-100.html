<!DOCTYPE html>
<html>
<head>
<title>CSS 100 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:40px 6%}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:25px}
.live{display:inline-flex;align-items:center;gap:7px;color:#ff6422}
.dot{width:9px;height:9px;background:#ff6422;border-radius:50%;animation:pulse 1s infinite}
.num{font-size:32px;font-weight:bold}
@keyframes pulse{50%{opacity:.3;transform:scale(.7)}}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<div class="live"><span class="dot"></span> LIVE DATA</div>
<h1>Real-Time Analytics</h1>
<div class="grid">
<div class="card"><small>Online Now</small><div class="num">1,284</div></div>
<div class="card"><small>Requests/sec</small><div class="num">842</div></div>
<div class="card"><small>Active Sessions</small><div class="num">3,920</div></div>
<div class="card"><small>Server Load</small><div class="num">42%</div></div>
</div>
</main>
</body>
</html>
