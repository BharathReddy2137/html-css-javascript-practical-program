<!DOCTYPE html>
<html><head><title>CSS 185 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial}
nav{padding:20px 7%;background:#111}.logo span{color:#ff6422}main{max-width:900px;margin:50px auto;padding:20px}
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.member{background:#151515;border:1px solid #2a2a2a;padding:22px;border-radius:15px}
.avatar{font-size:30px}.role{color:#ff6422}@media(max-width:700px){.team{grid-template-columns:1fr}}
</style></head>
<body><nav><b class="logo">Dev<span>Core.</span></b></nav>
<main><h1>Team Management</h1><div class="team">
<div class="member"><div class="avatar">👨</div><h3>Alex</h3><p class="role">Admin</p></div>
<div class="member"><div class="avatar">👩</div><h3>Sarah</h3><p class="role">Designer</p></div>
<div class="member"><div class="avatar">👨</div><h3>John</h3><p class="role">Developer</p></div>
</div></main></body></html>
