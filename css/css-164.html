<!DOCTYPE html>
<html>
<head>
<title>CSS 164 | DevCore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 7%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{padding:50px 7%}.flow{display:flex;align-items:center;justify-content:center;gap:15px;flex-wrap:wrap}.box{padding:25px;background:#151515;border:1px solid #2a2a2a;border-radius:14px}.trigger{border-color:#ff6422}.arrow{color:#ff6422}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main><h1>Trigger & Action Workflow</h1><div class="flow">
<div class="box trigger">Trigger<br><small>New signup</small></div><div class="arrow">→</div>
<div class="box">Condition<br><small>Plan = Pro</small></div><div class="arrow">→</div>
<div class="box">Action<br><small>Send email</small></div>
</div></main>
</body>
</html>
