<!DOCTYPE html>
<html>
<head>
<title>CSS 109 | DevCore</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
nav{height:70px;background:#111;border-bottom:1px solid #2a2a2a;padding:0 6%;display:flex;align-items:center}
.logo{font-size:25px;font-weight:bold}.logo span{color:#ff6422}
main{max-width:850px;margin:50px auto;padding:20px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:30px}
.heat{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.cell{height:40px;background:#292929;border-radius:5px}
.l1{background:#57301f}.l2{background:#8c3e20}.l3{background:#c54d21}.l4{background:#ff6422}
</style>
</head>
<body>
<nav><div class="logo">Dev<span>Core.</span></div></nav>
<main>
<h1>Activity Heatmap</h1>
<div class="card">
<div class="heat">
<div class="cell l1"></div><div class="cell l3"></div><div class="cell l2"></div><div class="cell l4"></div><div class="cell l1"></div><div class="cell l3"></div><div class="cell l4"></div><div class="cell l2"></div>
<div class="cell l2"></div><div class="cell l4"></div><div class="cell l3"></div><div class="cell l1"></div><div class="cell l4"></div><div class="cell l2"></div><div class="cell l3"></div><div class="cell l4"></div>
<div class="cell l4"></div><div class="cell l2"></div><div class="cell l1"></div><div class="cell l3"></div><div class="cell l2"></div><div class="cell l4"></div><div class="cell l1"></div><div class="cell l3"></div>
</div>
</div>
</main>
</body>
</html>
